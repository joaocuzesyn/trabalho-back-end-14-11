<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de API Dinâmica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Exemplo de API Dinâmica</h1>
            <p>Este projeto consome dados de uma API e os exibe dinamicamente.</p>
        </header>
        
        <main>
            <div class="controls">
                <button class="btn btn-primary" id="refreshBtn">
                    <span class="btn-icon">🔄</span>
                    Atualizar Dados
                </button>
                <button class="btn btn-secondary" id="filterBtn">
                    <span class="btn-icon">🔍</span>
                    Filtrar Usuários
                </button>
            </div>
            
            <div id="result">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Carregando dados da API...</p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Projeto de exemplo - Consumo de API com JavaScript</p>
        </footer>
    </div>
    
    <!-- Modal para detalhes do usuário -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
